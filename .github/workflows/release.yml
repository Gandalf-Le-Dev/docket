name: Release

# Cut a release without needing to push a tag from anywhere: run this from the
# Actions tab (or `gh workflow run release.yml -f version=v0.1.0`). It tests,
# creates the tag at the chosen ref, and publishes the container image.
#
# A tag pushed by hand still works too — ci.yml publishes the image for those.
# (This workflow's own tag push uses GITHUB_TOKEN, which GitHub deliberately
# does not let re-trigger workflows, so the two paths never double-build.)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. v0.1.0"
        required: true

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...
      - name: Create and push the tag
        run: |
          ver="${{ inputs.version }}"
          [[ "$ver" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "version must look like v1.2.3"; exit 1; }
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$ver" -m "Docket $ver"
          git push origin "$ver"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            VERSION=${{ inputs.version }}
          tags: |
            ghcr.io/gandalf-le-dev/docket:${{ inputs.version }}
            ghcr.io/gandalf-le-dev/docket:latest
