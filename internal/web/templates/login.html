<!doctype html>
<html lang="en">
<head>
  {{template "head" .}}
  <title>docket — sign in</title>
</head>
<body>
<div class="band">
  <header class="hdr">
    {{template "mark" .}}
    <span class="wm">docket</span>
  </header>
</div>
<div class="login">
    {{if .Error}}<div class="error" style="margin: 0 0 var(--space-5)">{{.Error}}</div>{{end}}
    <h1 class="heading" style="margin: 0 0 var(--space-2)">Sign in</h1>
    <p class="body muted" style="margin: 0 0 var(--space-5)">
      Paste a review token. It is kept in a cookie on this device, so you do this once.</p>
    <form method="post" action="/login">
      <label for="token">Review token</label>
      <input type="password" id="token" name="token" autocomplete="current-password" autofocus>
      <p><button type="submit" class="btn btn--primary">Sign in</button></p>
    </form>
</div>
</body>
</html>
