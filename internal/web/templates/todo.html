<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>#{{.Item.ID}} {{.Item.Title}} · Docket</title>
  {{template "style" .}}
</head>
<body>
<main>
  <header class="top">
    <h1><a href="/">Docket</a></h1>
    <form method="post" action="/logout"><button type="submit">Sign out</button></form>
  </header>

  {{if .Error}}<div class="error">{{.Error}}</div>{{end}}

  <nav class="tabs">
    <a href="/{{if ne .Item.State "open"}}?state={{.Item.State}}{{end}}">← all items</a>
    {{if .Item.Scope}}<a href="/?state={{.Item.State}}&scope={{.Item.Scope}}">scope: {{.Item.Scope}}</a>{{end}}
  </nav>

  {{template "item" .Item}}

  <p class="meta">Link: <a href="{{.URL}}">{{.URL}}</a></p>
</main>
</body>
</html>
